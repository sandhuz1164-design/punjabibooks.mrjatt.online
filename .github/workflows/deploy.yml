name: Deploy BookStore-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, json, curl, xml, zip, gd
          ini-values: memory_limit=512M

      - name: Create db.php from secrets
        run: |
          cat > db.php << 'EOF'
          <?php

          const DB_HOST = '${{ secrets.DB_HOST }}';
          const DB_NAME = '${{ secrets.DB_NAME }}';
          const DB_USER = '${{ secrets.DB_USER }}';
          const DB_PASS = '${{ secrets.DB_PASS }}';

          function db(): PDO
          {
              static $pdo = null;
              if ($pdo === null) {
                  $pdo = new PDO(
                      'mysql:host=' . DB_HOST . ';dbname=' . DB_NAME . ';charset=utf8mb4',
                      DB_USER,
                      DB_PASS,
                      [
                          PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION,
                          PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                          PDO::ATTR_EMULATE_PREPARES   => false,
                      ]
                  );
              }
              return $pdo;
          }

          function q(string $sql, array $params = []): PDOStatement
          {
              $stmt = db()->prepare($sql);
              $stmt->execute($params);
              return $stmt;
          }

          function rows(string $sql, array $params = []): array
          {
              return q($sql, $params)->fetchAll();
          }

          function one(string $sql, array $params = []): ?array
          {
              $row = q($sql, $params)->fetch();
              return $row === false ? null : $row;
          }

          function e($value): string
          {
              return htmlspecialchars((string) $value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
          }

          function money($value): string
          {
              return number_format((float) $value, 0, '.', ',');
          }

          function canon_category(string $name): string
          {
              $name = preg_replace('/\s+and\s+/i', ' & ', trim($name));
              $name = preg_replace('/\s+/', ' ', trim($name));
              return $name === '' ? 'Uncategorised' : ucwords(strtolower($name));
          }

          const CATEGORY_SQL = "REPLACE(LOWER(Category),' and ',' & ')";

          function categories(): array
          {
              $found = [];
              foreach (rows("SELECT Category FROM products
                             WHERE Category IS NOT NULL AND Category <> ''") as $r) {
                  $key = canon_category((string) $r['Category']);
                  $found[$key] = ($found[$key] ?? 0) + 1;
              }
              arsort($found);
              $out = [];
              foreach ($found as $label => $count) {
                  $out[] = ['label' => (string) $label, 'count' => $count];
              }
              return $out;
          }

          const SORTS = [
              'price-asc'  => 'Price ASC',
              'price-desc' => 'Price DESC',
              'disc-desc'  => 'Discount DESC',
              'disc-asc'   => 'Discount ASC',
              'title'      => 'Title ASC',
          ];

          function order_by(string $sort): string
          {
              return SORTS[$sort] ?? SORTS['price-asc'];
          }

          function like_term(string $q): string
          {
              return '%' . str_replace(['\\', '%', '_'], ['\\\\', '\\%', '\\_'], trim($q)) . '%';
          }

          function cover(string $pid): string
          {
              return 'img/books/' . $pid . '.jpg';
          }
          EOF

      - name: Build static site
        run: |
          php build/build.php

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz --delete --exclude='.git/'
          path: public/
          remote_path: /var/www/bookstore/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASS }}

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_pass: ${{ secrets.SSH_KEY_PASS }}
          script: |
            nginx -t && sudo systemctl reload nginx