name: Deploy BookStore-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, json, curl, xml, zip, gd
          ini-values: memory_limit=512M

      - name: Install Composer (if needed)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader
          fi

      - name: Build static site
        run: |
          php build/build.php

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz --delete --exclude='.git/'
          path: public/
          remote_path: /var/www/bookstore/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASS }}

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_pass: ${{ secrets.SSH_KEY_PASS }}
          script: |
            nginx -t && sudo systemctl reload nginx